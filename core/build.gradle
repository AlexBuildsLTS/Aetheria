[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.github.mgsx-dev.gdx-gltf:gltf:2.2.1"
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  
  // Coroutines
  api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
  
  // Serialization
  api "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"

  // Ktor
  api "io.ktor:ktor-client-core:2.3.7"
  api "io.ktor:ktor-client-cio:2.3.7"
  api "io.ktor:ktor-serialization-kotlinx-json:2.3.7"
  api "io.ktor:ktor-client-content-negotiation:2.3.7"

  // Supabase
  api "io.github.jan-tennert.supabase:postgrest-kt:2.1.3"
  api "io.github.jan-tennert.supabase:realtime-kt:2.1.3"
  api "io.github.jan-tennert.supabase:gotrue-kt:2.1.3"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
