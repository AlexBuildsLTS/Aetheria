[versions]
gdxBackendLwjgl3 = "1.13.1"
gdxBox2d = "1.13.1"
gdxFreetype = "1.13.1"
gdxPlatform = "1.13.1"
khealth = "2.1.1"
kotlin = "2.0.0"
agp = "8.7.3"
gdx = "1.13.1"
ashley = "1.7.4"
ktor = "2.3.12"
ktorServer = "2.3.12"
supabase = "2.6.1"
coroutines = "1.9.0"
postgresql = "42.7.4"
h2 = "2.3.232"
cohort = "2.8.2"
androidxSplashscreen = "1.0.1"
gdxGltf = "2.2.1"
lwjgl = "3.3.5"

[libraries]
# Core
gdx-core = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-box2d = { module = "com.badlogicgames.gdx:gdx-box2d", version.ref = "gdxBox2d" }
gdx-bullet = { module = "com.badlogicgames.gdx:gdx-bullet", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
ashley = { module = "com.badlogicgames.ashley:ashley", version.ref = "ashley" }
gdx-gltf = { module = "com.github.mgsx-dev:gdx-gltf", version.ref = "gdxGltf" }

# Desktop
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }

# Android
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }

# Networking
khealth = { module = "dev.hayden:khealth", version.ref = "khealth" }

# Ktor Client
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorClientEncoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktorSerializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Ktor Server
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktorServer" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktorServer" }
ktorServerContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktorServer" }
ktorServerCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktorServer" }
ktorServerCallId = { module = "io.ktor:ktor-server-call-id", version.ref = "ktorServer" }
ktorServerMetrics = { module = "io.ktor:ktor-server-metrics", version.ref = "ktorServer" }
ktorServerPartialContent = { module = "io.ktor:ktor-server-partial-content", version.ref = "ktorServer" }
ktorServerForwardedHeader = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktorServer" }
ktorServerConditionalHeaders = { module = "io.ktor:ktor-server-conditional-headers", version.ref = "ktorServer" }

# Supabase
supabase-gotrue = { module = "io.github.jan-tennert.supabase:gotrue-kt", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt", version.ref = "supabase" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2Database = { module = "com.h2database:h2", version.ref = "h2" }

# Monitoring
cohortKtor = { module = "com.sksamuel.cohort:cohort-ktor", version.ref = "cohort" }

# Utils
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
ktorClient = ["ktorClientCore", "ktorClientCio", "ktorClientLogging"]
supabaseClient = ["supabase-gotrue", "supabase-postgrest", "supabase-realtime"]
ktorServer = ["ktorServerCore", "ktorServerNetty", "ktorServerContentNegotiation", "ktorServerCallLogging", "ktorServerCallId", "ktorServerMetrics", "ktorServerPartialContent", "ktorServerForwardedHeader", "ktorServerConditionalHeaders"]
gdx = ["gdx-core", "gdx-box2d", "gdx-bullet", "gdx-freetype", "ashley", "gdx-gltf", "gdx-backend-lwjgl3", "gdx-backend-android", "gdx-platform"]
